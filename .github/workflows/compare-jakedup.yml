name: Inspect public JakedUp package format
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public vendor and Express manifests
        run: node scripts/inspect-jakedup.mjs
